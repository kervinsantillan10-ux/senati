<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiberShield - Contacto</title>
  <link rel="stylesheet" href="./css/formulario registro.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <!-- Busca las líneas 13 a 16 y cámbialas por esto: -->
<div class="logo-box">
    <!-- Reemplazamos el div anterior por la etiqueta de la imagen del escudo -->
    <img src="img/logo-cibershelf.png" class="logo-img" alt="Logo Cibershield">
    <span class="logo-text">CIBERSHIELD</span>
</div>

      <nav>
        <ul>
          <li><a href="index.html">INICIO</a></li>
          <li><a href="catalogo.html">CATÁLOGO</a></li>
          <li><a href="servicios.html">SERVICIOS</a></li>
          <li><a href="nosotros.html">NOSOTROS</a></li>
          <li><a href="contacto.html" class="active">CONTACTO</a></li>
          <li><a href="login.html">INICIAR SESIÓN</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-container">
      <!-- Columna Izquierda: Formulario -->
      <section class="contact-form">
        <h2>REGISTRO DE USUARIO</h2>
        <form action="#">
            <fieldset>
                <legend>Crear una cuenta nueva</legend>
                
                <div class="form-group">
                    <label for="reg_nombre">Nombre Completo:</label>
                    <input type="text" id="reg_nombre" name="reg_nombre" placeholder="Escribe tu nombre" required="true"/>
                </div>
                
                <div class="form-group">
                    <label for="reg_email">Correo Electrónico:</label>
                    <input type="email" id="reg_email" name="reg_email" placeholder="ejemplo@correo.com" required="true"/>
                </div>
                
                <div class="form-group">
                    <label for="reg_pass">Contraseña:</label>
                    <input type="password" id="reg_pass" name="reg_pass" placeholder="Crea una contraseña" required="true"/>
                </div>
                
                <div class="form-group">
                    <label class="group-title">Género:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" id="reg_fem" name="reg_genero" value="femenino"/>
                            <span>Femenino</span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" id="reg_masc" name="reg_genero" value="masculino"/>
                            <span>Masculino</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <input type="submit" value="Registrarse" class="btn"/>
                    <input type="reset" value="Limpiar" class="btn"/>
                </div>
            </fieldset>
        </form>
      </section>

      <!-- Sección de Redes Sociales -->
      <section class="social-section">
        <h2>REDES SOCIALES</h2>
        <div class="social-grid">
          <div class="social-item">
            <div class="social-card">
              <img src="img/IG.jpg" alt="Instagram">
            </div>
            <span class="social-name">INSTAGRAM</span>
          </div>

          <div class="social-item">
            <div class="social-card">
              <img src="img/FB.jpg" alt="Facebook">
            </div>
            <span class="social-name">FACEBOOK</span>
          </div>

          <div class="social-item">
            <div class="social-card">
              <img src="img/X.jpg" alt="X">
            </div>
            <span class="social-name">X</span>
          </div>

          <div class="social-item">
            <div class="social-card">
              <img src="img/tiktok.jpg" alt="TikTok">
            </div>
            <span class="social-name">TIKTOK</span>
          </div>
        </div>

        <!-- Teléfono sin ningún cuadro ni borde alrededor de la imagen -->
        <div class="phone-container">
          <img src="img/WSP.jpg" alt="Teléfono" class="phone-icon">
          <span class="phone-text">+51 951 108 456</span>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 CiberShield · Lima, Perú</p>
  </footer>

  <script>
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            alert('¡Registro exitoso!'); 
            window.location.href = 'index.html'; 
        });
    }
  </script>
  <script src="efectos.js"></script>
</body>
</html>
